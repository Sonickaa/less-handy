name: Daily commit

# Runs every second day (together with "Tiny Art Generator" this makes
# two commits on each of those days).
#
# A plain "*/2" day-of-month cron restarts every month (31st -> 1st runs two
# days in a row), so the job is scheduled daily and the "Check day" step
# skips every other day based on the number of days since 1970-01-01.

permissions:
  contents: write

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC, but only commits every second day
  workflow_dispatch: # manual runs always commit

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check day
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off day, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Append date to activity_log.txt
        if: steps.gate.outputs.run == 'true'
        run: echo "$(date -u)" >> activity_log.txt

      - name: Commit & push
        if: steps.gate.outputs.run == 'true'
        run: |
          # Your GitHub noreply address, so the commit counts on your profile
          git config user.name "Sonia Chaboud"
          git config user.email "122700687+Sonickaa@users.noreply.github.com"
          git add activity_log.txt
          git commit -m "Update log $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
