name: Tiny Art Generator

# Runs every second day, on the same days as "Daily commit" (see the note
# there about why the cron is daily and a step skips the off days).

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * *" # daily at 17:00 UTC, but only commits every second day
  workflow_dispatch: # manual runs always commit

jobs:
  generate-art:
    runs-on: ubuntu-latest

    steps:
      - name: Check day
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off day, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Generate ASCII art partial
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/views/shared
          ART=""
          CHARS='*<^°>'
          ROWS=20
          COLS=20
          for i in $(seq 1 $ROWS); do
            ROW=""
            for j in $(seq 1 $COLS); do
              if [ "$i" -eq 1 ] || [ "$i" -eq "$ROWS" ] || [ "$j" -eq 1 ] || [ "$j" -eq "$COLS" ]; then
                ROW="${ROW}*"
              elif [ "$i" -eq "$j" ] || [ $(( i + j - 1 )) -eq "$ROWS" ]; then
                ROW="${ROW}^"
              else
                idx=$(( RANDOM % ${#CHARS} ))
                ROW="${ROW}${CHARS:idx:1}"
              fi
            done
            ART="${ART}${ROW}\n"
          done
          printf '<pre>%b</pre>\n' "$ART" > app/views/shared/_tiny_art.html.erb

      - name: Commit & push
        if: steps.gate.outputs.run == 'true'
        run: |
          # Your GitHub noreply address, so the commit counts on your profile
          git config user.name "Sonia Chaboud"
          git config user.email "122700687+Sonickaa@users.noreply.github.com"
          git add app/views/shared/_tiny_art.html.erb
          git commit -m "Generate new tiny ASCII art $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || { echo "No changes to commit"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
